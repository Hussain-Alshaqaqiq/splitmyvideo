<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصائيات النظام - SplitMyVideo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: #666;
            font-weight: 500;
        }
        
        .stat-value {
            color: #333;
            font-weight: bold;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }
        
        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            display: block;
            margin: 20px auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        
        .status-good { color: #22c55e; }
        .status-warning { color: #f59e0b; }
        .status-error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 إحصائيات النظام</h1>
        
        <div class="stats-grid">
            <!-- RAM Usage -->
            <div class="stat-card">
                <h2>💾 استهلاك الذاكرة (RAM)</h2>
                <div class="stat-item">
                    <span class="stat-label">الإجمالي</span>
                    <span class="stat-value" id="ram-total">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">المستخدم</span>
                    <span class="stat-value" id="ram-used">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">المتاح</span>
                    <span class="stat-value" id="ram-available">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">النسبة</span>
                    <span class="stat-value" id="ram-percent">--</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="ram-progress"></div>
                </div>
            </div>
            
            <!-- Swap Usage -->
            <div class="stat-card">
                <h2>💿 Swap Memory</h2>
                <div class="stat-item">
                    <span class="stat-label">الإجمالي</span>
                    <span class="stat-value" id="swap-total">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">المستخدم</span>
                    <span class="stat-value" id="swap-used">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">النسبة</span>
                    <span class="stat-value" id="swap-percent">--</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="swap-progress"></div>
                </div>
            </div>
            
            <!-- Queue Stats -->
            <div class="stat-card">
                <h2>⚙️ طابور المعالجة</h2>
                <div class="stat-item">
                    <span class="stat-label">عمليات نشطة</span>
                    <span class="stat-value" id="queue-active">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">في الانتظار</span>
                    <span class="stat-value" id="queue-size">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">أقصى عمليات</span>
                    <span class="stat-value" id="queue-max">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">تم معالجتها</span>
                    <span class="stat-value" id="queue-processed">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">فشلت</span>
                    <span class="stat-value" id="queue-failed">--</span>
                </div>
            </div>
            
            <!-- Files Stats -->
            <div class="stat-card">
                <h2>📁 الملفات المؤقتة</h2>
                <div class="stat-item">
                    <span class="stat-label">عدد الملفات</span>
                    <span class="stat-value" id="files-count">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">الحجم الإجمالي</span>
                    <span class="stat-value" id="files-size">--</span>
                </div>
            </div>
        </div>
        
        <button class="refresh-btn" onclick="loadStats()">🔄 تحديث</button>
    </div>
    
    <script>
        function loadStats() {
            fetch('/stats')
                .then(response => response.json())
                .then(data => {
                    // RAM
                    if (data.ram_usage) {
                        document.getElementById('ram-total').textContent = data.ram_usage.total_gb + ' GB';
                        document.getElementById('ram-used').textContent = data.ram_usage.used_gb + ' GB';
                        document.getElementById('ram-available').textContent = data.ram_usage.available_gb + ' GB';
                        document.getElementById('ram-percent').textContent = data.ram_usage.percent + '%';
                        document.getElementById('ram-progress').style.width = data.ram_usage.percent + '%';
                        
                        // Swap
                        document.getElementById('swap-total').textContent = data.ram_usage.swap_total_gb + ' GB';
                        document.getElementById('swap-used').textContent = data.ram_usage.swap_used_gb + ' GB';
                        document.getElementById('swap-percent').textContent = data.ram_usage.swap_percent + '%';
                        document.getElementById('swap-progress').style.width = data.ram_usage.swap_percent + '%';
                    }
                    
                    // Queue
                    if (data.queue) {
                        document.getElementById('queue-active').textContent = data.queue.active_processes;
                        document.getElementById('queue-size').textContent = data.queue.queue_size;
                        document.getElementById('queue-max').textContent = data.queue.max_concurrent;
                        document.getElementById('queue-processed').textContent = data.queue.total_processed;
                        document.getElementById('queue-failed').textContent = data.queue.total_failed;
                    }
                    
                    // Files
                    if (data.files) {
                        document.getElementById('files-count').textContent = data.files.total_files;
                        document.getElementById('files-size').textContent = data.files.total_size_mb.toFixed(2) + ' MB';
                    }
                })
                .catch(error => {
                    console.error('Error loading stats:', error);
                    alert('خطأ في تحميل الإحصائيات');
                });
        }
        
        // تحميل عند فتح الصفحة
        loadStats();
        
        // تحديث تلقائي كل 5 ثواني
        setInterval(loadStats, 5000);
    </script>
</body>
</html>
