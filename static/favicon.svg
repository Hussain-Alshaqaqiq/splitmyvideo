<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- خلفية دائرية -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- إطار الفيديو -->
  <rect x="25" y="30" width="50" height="35" rx="3" fill="white" opacity="0.9"/>
  
  <!-- زر Play -->
  <polygon points="40,40 40,55 52,47.5" fill="#667eea"/>
  
  <!-- خط القص -->
  <line x1="30" y1="50" x2="70" y2="50" stroke="white" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- مقص صغير -->
  <g transform="translate(60, 45)">
    <circle cx="0" cy="0" r="3" fill="#ffeb3b"/>
    <circle cx="0" cy="6" r="3" fill="#ffeb3b"/>
    <line x1="-5" y1="3" x2="5" y2="3" stroke="#ffeb3b" stroke-width="2"/>
  </g>
</svg>
